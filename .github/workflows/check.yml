name: check

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python -m json.tool .claude-plugin/marketplace.json > /dev/null

  # The macOS system Python (3.9 today) is the oldest one the skill runs on.
  render-macos-system-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests -v
